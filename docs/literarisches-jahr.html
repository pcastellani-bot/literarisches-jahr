<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Das literarische Jahr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"><style>
:root{
  --grund:#FAFAF7; --karte:#F2F2ED; --kante:#E3E3DC; --kante2:#C5C5BC;
  --tinte:#26261F; --leise:#5F5F55; --still:#90908A;
  --orange:#CC6E25; --blau:#005081; --blau-hell:#E4EBF0; --orange-hell:#F7E9DA;
  --gruen:#3D6B4A; --gruen-hell:#E2EBE4;
  --serif:'Newsreader',Georgia,serif;
  --sans:'IBM Plex Sans Condensed','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Fest hell: das Widget folgt Patricks Seite, nicht dem Theme des Betrachters */
:root{color-scheme:light}
body{background:var(--grund);color:var(--tinte);font-family:var(--sans);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#lj{display:flex;flex-direction:column;height:100vh;min-height:420px;
  max-width:820px;margin:0;padding:14px 0 0;position:relative}


.lj-filter{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;flex:none;
  border-bottom:1px solid var(--kante2)}
.lj-filter button{font-family:var(--sans);font-size:13px;padding:4px 11px;cursor:pointer;
  border:1px solid var(--kante2);background:var(--karte);color:var(--leise);border-radius:2px}
.lj-filter button:hover{color:var(--tinte);border-color:var(--leise)}
.lj-filter button[aria-pressed="true"]{background:var(--tinte);color:var(--grund);
  border-color:var(--tinte)}
.lj-filter button:focus-visible{outline:2px solid var(--blau);outline-offset:1px}
.lj-filter button.offen[aria-pressed="true"]{background:var(--gruen);border-color:var(--gruen);
  color:#fff}
.lj-suche{font-family:var(--sans);font-size:13px;padding:4px 10px;
  flex:0 1 230px;min-width:150px;
  border:1px solid var(--kante2);background:var(--karte);color:var(--tinte);border-radius:2px}
.lj-suche:focus{outline:none;border-color:var(--blau)}

.lj-abo{font-family:var(--sans);font-size:13px;font-weight:500;padding:5px 14px;
  margin-left:auto;border:1px solid var(--blau);background:var(--blau);color:#fff;
  border-radius:2px;text-decoration:none;white-space:nowrap;line-height:1.45}
.lj-abo:hover{background:var(--tinte);border-color:var(--tinte)}
.lj-abo:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

.lj-liste{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:10px;
  scrollbar-width:thin;scrollbar-color:var(--kante2) transparent}
.lj-liste::-webkit-scrollbar{width:9px}
.lj-liste::-webkit-scrollbar-track{background:transparent}
.lj-liste::-webkit-scrollbar-thumb{background:var(--kante2);border-radius:5px;
  border:2px solid var(--grund)}
.lj-liste::-webkit-scrollbar-thumb:hover{background:var(--still)}
/* Zeigt an, dass die Liste weitergeht. Blendet sich am Ende aus. */
.lj-mehr{position:absolute;left:0;right:0;bottom:58px;height:52px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(250,250,247,0) 0%,var(--grund) 82%);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:1;transition:opacity .2s}
.lj-mehr[hidden]{display:flex!important;opacity:0}
.lj-mehr span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--still);background:var(--grund);padding:0 10px 1px}
.lj-monat{position:sticky;top:0;z-index:2;background:var(--grund);
  font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.02em;
  padding:14px 0 5px;border-bottom:1px solid var(--kante)}
.lj-monat span{color:var(--still);font-weight:400;font-size:12px;font-family:var(--sans)}
.lj-eintrag{display:grid;grid-template-columns:86px 1fr auto;gap:2px 14px;
  padding:10px 0 9px;border-bottom:1px solid var(--kante);align-items:start}
.lj-eintrag:hover{background:var(--karte)}
.lj-tag{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--blau);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.lj-tag em{font-style:normal;font-size:12px;font-weight:400;color:var(--still);
  display:block;font-family:var(--sans);letter-spacing:.03em}
.lj-was{min-width:0}
.lj-was a.titel{color:var(--tinte);text-decoration:none;font-weight:500;font-size:15px;
  border-bottom:1px solid transparent}
.lj-was a.titel:hover{border-bottom-color:var(--orange);color:var(--orange)}
.lj-was a:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
.lj-meta{font-size:12.5px;color:var(--leise);margin-top:1px}
.lj-marke{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:2px;vertical-align:1px;margin-left:6px;font-weight:500}
.lj-marke.frist{background:var(--blau-hell);color:var(--blau)}
.lj-marke.unfest{background:var(--orange-hell);color:var(--orange)}
.lj-marke.offen{background:var(--gruen-hell);color:var(--gruen)}

.lj-merk{font-family:var(--sans);font-size:11px;letter-spacing:.04em;padding:3px 8px;
  cursor:pointer;border:1px solid var(--kante2);background:transparent;color:var(--still);
  border-radius:2px;white-space:nowrap;align-self:center;text-decoration:none;
  display:inline-block;line-height:1.5}
.lj-merk:hover{border-color:var(--blau);color:var(--blau)}
.lj-merk:focus-visible{outline:2px solid var(--blau);outline-offset:1px}

.lj-eintrag.eigen{background:var(--orange-hell);border-bottom-color:var(--orange);
  box-shadow:inset 3px 0 0 var(--orange)}
.lj-eintrag.eigen .lj-tag,.lj-eintrag.eigen .lj-was{padding-left:11px}
.lj-eintrag.eigen .lj-tag{color:var(--orange)}
.lj-eintrag.eigen .lj-was a.titel{font-weight:600}
.lj-eintrag.eigen .lj-meta{color:var(--tinte)}

.lj-leer{padding:40px 0;text-align:left;color:var(--still);font-size:14px}
.lj-fuss{flex:none;margin-top:14px;padding:11px 0 16px;border-top:1px solid var(--kante);
  font-size:11.5px;color:var(--still);display:flex;justify-content:flex-start;
  gap:6px 20px;flex-wrap:wrap}
.lj-fuss a{color:var(--blau);text-decoration:none;border-bottom:1px solid transparent}
.lj-fuss a:hover{border-bottom-color:var(--blau)}
@media (max-width:560px){
  #lj{padding:12px 0 0}
  .lj-eintrag{grid-template-columns:1fr auto;gap:1px 10px}
  .lj-abo{margin-left:0;width:100%;text-align:center}
  .lj-tag{grid-column:1;font-size:13px}
  .lj-tag em{display:inline;font-size:13px;color:var(--still)}
  .lj-was{grid-column:1/-1}
  .lj-merk{grid-column:2;grid-row:1;align-self:start}
  .lj-was a.titel{font-size:15px;line-height:1.3;display:inline-block}
  .lj-marke{margin-left:0;margin-top:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ------------------------------------------------------------------
   Einstellungen. Nur dieser Block muss angepasst werden.
   ------------------------------------------------------------------ */
const KONFIG={
  stand:"13. September 2026",
  // Vergangene Termine ausblenden. Ohne das zeigt der Kalender im Januar
  // ein halbes Jahr Vergangenheit.
  nurKommende:true
};
</script>
<script>
(function(){
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August",
  "September","Oktober","November","Dezember"];
const TYP={Festival:"Festival",Messe:"Messe",Reihe:"Lesereihe",Markt:"Buchmarkt",
  Tagung:"Tagung",Ausschreibung:"Ausschreibung",Preis:"Preis",Kurs:"Schreibjahr"};
const REG={DCH:"Deutschschweiz",FCH:"Romandie",ICH:"Ticino",national:"schweizweit"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const teil=s=>String(s||"").split("-");
const nurTag=s=>{const p=teil(s);return p[2]&&p[2]!=="00"?+p[2]:null;};
const fristTxt=s=>{const p=teil(s);
  return p[2]&&p[2]!=="00"?`${+p[2]}. ${MON[+p[1]-1]}`:MON[+p[1]-1]+" "+p[0];};
const HEUTE=new Date();HEUTE.setHours(0,0,0,0);
const endet=z=>{const p=teil(z.b||z.v);
  const j=+p[0],m=+p[1]-1,t=p[2]&&p[2]!=="00"?+p[2]:new Date(j,m+1,0).getDate();
  return new Date(j,m,t);};
const zustand={t:new Set(),r:new Set(),x:new Set(),q:""};

function passt(z){
  if(KONFIG.nurKommende&&endet(z)<HEUTE)return false;
  if(z.eig)return !zustand.x.size&&(!zustand.q||(z.n+z.o).toLowerCase().includes(zustand.q));
  if(zustand.x.has("offen")&&z.zg!=="offen")return false;
  if(zustand.t.size){
    const gr=z.t==="Preis"?"Ausschreibung":(z.t==="Markt"?"Messe":(z.t==="Tagung"?"Reihe":z.t));
    if(!zustand.t.has(gr))return false;}
  if(zustand.r.size&&!zustand.r.has(z.r)&&z.r!=="national")return false;
  if(zustand.q&&!(z.n+" "+z.o+" "+z.k+" "+(TYP[z.t]||"")).toLowerCase().includes(zustand.q))
    return false;
  return true;}

/* Termin in den eigenen Kalender. Der Download-Weg ist im eingebetteten
   iframe gesperrt, deshalb ein Link in einen neuen Tab. */
function gcal(z){
  const p=teil(z.v);
  const j=+p[0], m=+p[1]-1, t1=p[2]&&p[2]!=="00"?+p[2]:1;
  const von=new Date(j,m,t1), bis=endet(z);
  bis.setDate(bis.getDate()+1);
  const st=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+
    String(d.getDate()).padStart(2,"0");
  const text=[(TYP[z.t]||z.t)];
  if(z.f)text.push("Einreichfrist "+fristTxt(z.f));
  if(z.zgt)text.push(z.zgt);
  if(z.s!=="bestaetigt")text.push("Termin noch nicht bestätigt");
  text.push(z.u,"Aus dem literarischen Jahr, Salon der Künste");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent((z.eig?"Schreibjahr: ":"")+z.n)+
    "&dates="+st(von)+"/"+st(bis)+
    "&details="+encodeURIComponent(text.join("\n"))+
    "&location="+encodeURIComponent(z.o||"");
}

function zeichnen(){
  const paare=TERMINE.map((z,i)=>[z,i]).filter(([z])=>passt(z));
  const ziel=document.getElementById("lj-liste");
  if(!paare.length){ziel.innerHTML=
    '<p class="lj-leer">Nichts gefunden. Filter zurücksetzen oder anders suchen.</p>';
    document.getElementById("lj-zahl").textContent="0";return;}
  let h="",letzter="";
  paare.forEach(([z,i])=>{
    const p=teil(z.v), schl=p[0]+"-"+p[1];
    if(schl!==letzter){letzter=schl;
      h+=`<div class="lj-monat">${MON[+p[1]-1]} <span>${p[0]}</span></div>`;}
    const t1=nurTag(z.v), t2=z.b?nurTag(z.b):null;
    const anderer=z.b&&teil(z.b)[1]!==p[1];
    const datum=z.lauf?"":(t1?(t2&&(t2!==t1||anderer)
      ?(anderer?`${t1}.${+p[1]}.–${t2}.${+teil(z.b)[1]}.`:`${t1}.–${t2}.`)
      :`${t1}. ${MON[+p[1]-1].slice(0,3)}`):"");
    const unfest=z.s!=="bestaetigt";
    h+=`<div class="lj-eintrag${z.eig?" eigen":""}">
      <div class="lj-tag">${datum||(z.lauf?"":"—")}${
        z.lauf?'<em>laufend</em>':(datum?"":'<em>im Monat</em>')}${
        datum&&unfest?'<em>ungefähr</em>':""}</div>
      <div class="lj-was">
        <a class="titel" href="${esc(z.u)}" target="_blank" rel="noopener">${esc(z.n)}</a>${
          z.f?`<span class="lj-marke frist">bis ${esc(fristTxt(z.f))}</span>`:""}${
          z.zg==="offen"?'<span class="lj-marke offen">ohne Buchpublikation</span>':""}${
          unfest?'<span class="lj-marke unfest">noch nicht bestätigt</span>':""}
        <div class="lj-meta">${esc(TYP[z.t]||z.t)}${z.o?" · "+esc(z.o):""}${
          z.r&&!z.eig?" · "+esc(REG[z.r]||z.r):""}${z.zgt?" · "+esc(z.zgt):""}${
          z.no?" · "+esc(z.no):""}</div>
      </div>
      <a class="lj-merk" href="${esc(gcal(z))}" target="_blank" rel="noopener"
        title="Diesen Termin in den eigenen Kalender legen">merken</a>
    </div>`;});
  ziel.innerHTML=h;
  document.getElementById("lj-zahl").textContent=paare.length;
  setTimeout(hinweis,0);
  if(window.parent!==window)window.parent.postMessage(
    {typ:"literarischesJahr",hoehe:document.body.scrollHeight},"*");}


document.getElementById("lj-filter").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const an=b.getAttribute("aria-pressed")==="true";
  an?zustand[b.dataset.g].delete(b.dataset.v):zustand[b.dataset.g].add(b.dataset.v);
  b.setAttribute("aria-pressed",String(!an));zeichnen();});
document.getElementById("lj-suche").addEventListener("input",e=>{
  zustand.q=e.target.value.trim().toLowerCase();zeichnen();});

/* Der Hinweis verschwindet, sobald man unten angekommen ist */
const liste=document.getElementById("lj-liste"), mehr=document.getElementById("lj-mehr");
function hinweis(){
  const rest=liste.scrollHeight-liste.scrollTop-liste.clientHeight;
  mehr.hidden = rest < 24;
}
liste.addEventListener("scroll",hinweis,{passive:true});
window.addEventListener("resize",hinweis);

document.getElementById("lj-stand").textContent=
  "Angaben ohne Gewähr, Stand "+KONFIG.stand+". Termine bitte beim Veranstalter prüfen.";
/* Der Filter erscheint erst, wenn die Zugangsdaten wirklich im Bestand sind */
if(!TERMINE.some(z=>z.zg==="offen"))
  document.querySelector('[data-v="offen"]').remove();
zeichnen();
})();
</script>
