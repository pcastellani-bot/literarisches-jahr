<style>
:root{
  --grund:#FAFAF7; --karte:#F2F2ED; --kante:#E3E3DC; --kante2:#C5C5BC;
  --tinte:#26261F; --leise:#5F5F55; --still:#90908A;
  --orange:#CC6E25; --blau:#005081; --blau-hell:#E4EBF0; --orange-hell:#F7E9DA;
  --gruen:#3D6B4A; --gruen-hell:#E2EBE4;
  --serif:'Newsreader',Georgia,serif;
  --sans:'IBM Plex Sans Condensed','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Fest hell: das Widget folgt Patricks Seite, nicht dem Theme des Betrachters */
:root{color-scheme:light}
body{background:var(--grund);color:var(--tinte);font-family:var(--sans);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#lj{display:flex;flex-direction:column;height:100vh;min-height:420px;
  max-width:820px;margin:0;padding:14px 0 0}


.lj-filter{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;flex:none;
  border-bottom:1px solid var(--kante2)}
.lj-filter button{font-family:var(--sans);font-size:13px;padding:4px 11px;cursor:pointer;
  border:1px solid var(--kante2);background:var(--karte);color:var(--leise);border-radius:2px}
.lj-filter button:hover{color:var(--tinte);border-color:var(--leise)}
.lj-filter button[aria-pressed="true"]{background:var(--tinte);color:var(--grund);
  border-color:var(--tinte)}
.lj-filter button:focus-visible{outline:2px solid var(--blau);outline-offset:1px}
.lj-filter button.offen[aria-pressed="true"]{background:var(--gruen);border-color:var(--gruen);
  color:#fff}
.lj-suche{font-family:var(--sans);font-size:13px;padding:4px 10px;flex:1;min-width:130px;
  border:1px solid var(--kante2);background:var(--karte);color:var(--tinte);border-radius:2px}
.lj-suche:focus{outline:none;border-color:var(--blau)}

.lj-liste{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:10px}
.lj-monat{position:sticky;top:0;z-index:2;background:var(--grund);
  font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.02em;
  padding:14px 0 5px;border-bottom:1px solid var(--kante)}
.lj-monat span{color:var(--still);font-weight:400;font-size:12px;font-family:var(--sans)}
.lj-eintrag{display:grid;grid-template-columns:86px 1fr auto;gap:2px 14px;
  padding:10px 0 9px;border-bottom:1px solid var(--kante);align-items:start}
.lj-eintrag:hover{background:var(--karte)}
.lj-tag{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--blau);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.lj-tag em{font-style:normal;font-size:12px;font-weight:400;color:var(--still);
  display:block;font-family:var(--sans);letter-spacing:.03em}
.lj-was{min-width:0}
.lj-was a.titel{color:var(--tinte);text-decoration:none;font-weight:500;font-size:15px;
  border-bottom:1px solid transparent}
.lj-was a.titel:hover{border-bottom-color:var(--orange);color:var(--orange)}
.lj-was a:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
.lj-meta{font-size:12.5px;color:var(--leise);margin-top:1px}
.lj-marke{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:2px;vertical-align:1px;margin-left:6px;font-weight:500}
.lj-marke.frist{background:var(--blau-hell);color:var(--blau)}
.lj-marke.unfest{background:var(--orange-hell);color:var(--orange)}
.lj-marke.offen{background:var(--gruen-hell);color:var(--gruen)}

.lj-merk{font-family:var(--sans);font-size:11px;letter-spacing:.04em;padding:3px 8px;
  cursor:pointer;border:1px solid var(--kante2);background:transparent;color:var(--still);
  border-radius:2px;white-space:nowrap;align-self:center;text-decoration:none;
  display:inline-block;line-height:1.5}
.lj-merk:hover{border-color:var(--blau);color:var(--blau)}
.lj-merk:focus-visible{outline:2px solid var(--blau);outline-offset:1px}

.lj-eintrag.eigen{background:var(--orange-hell);padding-left:11px;padding-right:11px;
  border-bottom-color:var(--orange);border-left:3px solid var(--orange)}
.lj-eintrag.eigen .lj-tag{color:var(--orange)}
.lj-eintrag.eigen .lj-was a.titel{font-weight:600}
.lj-eintrag.eigen .lj-meta{color:var(--tinte)}

.lj-leer{padding:40px 0;text-align:left;color:var(--still);font-size:14px}
.lj-fuss{flex:none;padding:10px 0 14px;border-top:1px solid var(--kante);
  font-size:11.5px;color:var(--still);display:flex;justify-content:flex-start;
  gap:6px 20px;flex-wrap:wrap}
.lj-fuss a{color:var(--blau);text-decoration:none;border-bottom:1px solid transparent}
.lj-fuss a:hover{border-bottom-color:var(--blau)}
@media (max-width:560px){
  #lj{padding:12px 0 0}
  .lj-eintrag{grid-template-columns:1fr auto;gap:1px 10px}
  .lj-tag{grid-column:1;font-size:13px}
  .lj-tag em{display:inline;font-size:13px;color:var(--still)}
  .lj-was{grid-column:1/-1}
  .lj-merk{grid-column:2;grid-row:1;align-self:start}
  .lj-was a.titel{font-size:15px;line-height:1.3;display:inline-block}
  .lj-marke{margin-left:0;margin-top:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
